<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Feature Pair A</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #ffaaaa, #f5f5f5);
      color: #111;
    }
    .wrap {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-gap: 16px;
      padding: 24px;
    }
    .card {
      background: #fff8;
      backdrop-filter: blur(6px);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px #0002;
    }
    .card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }
    .title {
      padding: 16px 24px;
      font-size: 20px;
      font-weight: 700;
    }
    .subtitle {
      padding: 0 24px 16px 24px;
      color: #333;
      font-size: 14px;
    }
    .palette {
      display: flex;
      gap: 8px;
      padding: 0 24px 24px 24px;
      align-items: center;
    }
    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px #0002;
    }
    .header {
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.5px;
    }
    .badge {
      background: #111111;
      color: #fff;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
    }
    @media (max-width: 900px) {
      .wrap {
        grid-template-columns: 1fr;
      }
    }
  </style>
  </head>
  <body>
    <div class="header">
      <h1>Feature Pair A</h1>
      <div class="badge">Palette</div>
    </div>
    <div class="wrap">
      <div class="card">
        <img class="" src="file:///D:/Imaan/Projects/AiFashion/sample_top.png" alt="Top"/>
        <div class="title">Top</div>
        <div class="subtitle">Upper piece</div>
        <div class="palette">
          <div class="swatch" style="background:#ffaaaa"></div><div class="swatch" style="background:#f5f5f5"></div><div class="swatch" style="background:#111111"></div>
        </div>
      </div>
      <div class="card">
        <img class="" src="https://images.unsplash.com/photo-1516259762381-22954d7d3ad2?q=80&w=800&auto=format&fit=crop" alt="Bottom"/>
        <div class="title">Bottom</div>
        <div class="subtitle">Black Trousers</div>
        <div class="palette">
          <div class="swatch" style="background:#ffaaaa"></div><div class="swatch" style="background:#f5f5f5"></div><div class="swatch" style="background:#111111"></div>
        </div>
      </div>
      <div class="card">
        <img class="" src="https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?q=80&w=800&auto=format&fit=crop" alt="Shoes"/>
        <div class="title">Shoes</div>
        <div class="subtitle">White Sneakers</div>
        <div class="palette">
          <div class="swatch" style="background:#ffaaaa"></div><div class="swatch" style="background:#f5f5f5"></div><div class="swatch" style="background:#111111"></div>
        </div>
      </div>
    </div>
  </body>
</html>
